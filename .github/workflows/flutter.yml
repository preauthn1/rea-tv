name: Flutter Android TV CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rea-tv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub

  android-apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android ARM64 APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Write provenance
        run: |
          mkdir -p build/provenance build/delivery
          cp build/app/outputs/flutter-apk/app-debug.apk build/delivery/rea-tv-arm64-v8a-${GITHUB_SHA::12}-debug.apk
          printf 'commit=%s\nrun=%s\nworkflow=%s\nref=%s\nvariant=debug\nabi=arm64-v8a\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" "$GITHUB_REF" > build/provenance/BUILD_INFO.txt
          sha256sum build/delivery/*.apk > build/provenance/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rea-tv-android-arm64-v8a-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/delivery/*.apk
            build/provenance/BUILD_INFO.txt
            build/provenance/SHA256SUMS
